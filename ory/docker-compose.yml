# Local Ory stack for guest auth. Nothing here is deployed.
#   docker compose -f ory/docker-compose.yml up -d
#
# Kratos authenticates (public :4433, admin :4434), Hydra issues the OAuth2/OIDC
# tokens (public :4444, admin :4445), Mailpit catches the one-time codes
# (http://localhost:8025). Neither admin API is reachable from the browser.

# Kratos (uid 10000) and Hydra (uid 100) run as different users, so a shared
# volume leaves whichever writes first owning it and the other unable to open
# its database. Hence one volume each.
x-kratos: &kratos
    image: oryd/kratos:v1.3.1
    volumes:
        - kratos-sqlite:/var/lib/sqlite
        - ./config:/etc/config/kratos
    restart: on-failure

x-hydra: &hydra
    image: oryd/hydra:v2.2.0
    volumes:
        - hydra-sqlite:/var/lib/sqlite
        - ./config:/etc/config/hydra
    restart: on-failure

services:
    kratos-migrate:
        <<: *kratos
        command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes

    kratos:
        <<: *kratos
        depends_on:
            kratos-migrate:
                condition: service_completed_successfully
        ports:
            - "4433:4433"
            - "4434:4434"
        command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
        restart: unless-stopped

    hydra-migrate:
        <<: *hydra
        command: migrate sql -e --yes --config /etc/config/hydra/hydra.yml

    hydra:
        <<: *hydra
        depends_on:
            hydra-migrate:
                condition: service_completed_successfully
        ports:
            - "4444:4444"
            - "4445:4445"
        command: serve all --dev --config /etc/config/hydra/hydra.yml
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "hydra", "version"]
            interval: 2s
            timeout: 2s
            retries: 30

    # Registers the app as a public client. The admin API rather than the CLI,
    # because `hydra create oauth2-client` generates the client id and the
    # AuthProvider doc has to name a known one.
    #
    # `skip_consent` marks it first-party. Hydra still asks — the API answers on
    # /oauth/consent — but it records that there is nothing to show a user when
    # the client and the identity provider are the same product.
    hydra-client:
        image: curlimages/curl:latest
        depends_on:
            hydra:
                condition: service_healthy
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              if curl -sf http://hydra:4445/admin/clients/luminary-app >/dev/null 2>&1; then
                echo "client luminary-app already registered"; exit 0
              fi
              curl -sS -X POST http://hydra:4445/admin/clients \
                -H 'Content-Type: application/json' \
                -d '{
                  "client_id": "luminary-app",
                  "client_name": "Luminary app",
                  "grant_types": ["authorization_code", "refresh_token"],
                  "response_types": ["code"],
                  "scope": "openid offline_access profile email",
                  "audience": ["luminary-api"],
                  "redirect_uris": ["http://localhost:4174"],
                  "post_logout_redirect_uris": ["http://localhost:4174"],
                  "token_endpoint_auth_method": "none",
                  "skip_consent": true,
                  "skip_logout_consent": true
                }' && echo "" && echo "registered client luminary-app"

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
        restart: unless-stopped

volumes:
    kratos-sqlite:
    hydra-sqlite:
