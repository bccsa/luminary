# Local Ory stack for the guest-auth proof of concept. Nothing here is deployed.
#   docker compose -f ory/docker-compose.yml up -d
#
# Kratos authenticates (public :4433, admin :4434), Hydra issues the OAuth2/OIDC
# tokens (public :4444, admin :4445), Mailpit catches the one-time codes
# (http://localhost:8025). Hydra's admin API is never reachable from the browser.
services:
    kratos-migrate:
        image: oryd/kratos:v1.3.1
        volumes:
            - kratos-sqlite:/var/lib/sqlite
            - ./config:/etc/config/kratos
        command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
        restart: on-failure

    kratos:
        image: oryd/kratos:v1.3.1
        depends_on:
            kratos-migrate:
                condition: service_completed_successfully
        ports:
            - "4433:4433"
            - "4434:4434"
        volumes:
            - kratos-sqlite:/var/lib/sqlite
            - ./config:/etc/config/kratos
        command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
        restart: unless-stopped

    hydra-migrate:
        image: oryd/hydra:v2.2.0
        volumes:
            - hydra-sqlite:/var/lib/sqlite
            - ./config:/etc/config/hydra
        command: migrate sql -e --yes --config /etc/config/hydra/hydra.yml
        restart: on-failure

    hydra:
        image: oryd/hydra:v2.2.0
        depends_on:
            hydra-migrate:
                condition: service_completed_successfully
        ports:
            - "4444:4444"
            - "4445:4445"
        volumes:
            - hydra-sqlite:/var/lib/sqlite
            - ./config:/etc/config/hydra
        command: serve all --dev --config /etc/config/hydra/hydra.yml
        restart: unless-stopped

    # Registers the app as a public client once Hydra is up. The admin API
    # rather than the CLI, because `hydra create oauth2-client` generates the
    # client id and the AuthProvider doc has to name a known one.
    #
    # `skip_consent` marks it first-party: there is nothing for a user to
    # consent to when the client and the identity provider are the same product.
    hydra-client:
        image: curlimages/curl:latest
        depends_on:
            hydra:
                condition: service_started
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              until curl -sf http://hydra:4445/health/ready >/dev/null; do sleep 1; done
              if curl -sf http://hydra:4445/admin/clients/luminary-app >/dev/null 2>&1; then
                echo "client luminary-app already registered"; exit 0
              fi
              curl -sS -X POST http://hydra:4445/admin/clients \
                -H 'Content-Type: application/json' \
                -d '{
                  "client_id": "luminary-app",
                  "client_name": "Luminary app",
                  "grant_types": ["authorization_code", "refresh_token"],
                  "response_types": ["code"],
                  "scope": "openid offline_access profile email",
                  "audience": ["luminary-api"],
                  "redirect_uris": ["http://localhost:4174"],
                  "post_logout_redirect_uris": ["http://localhost:4174"],
                  "token_endpoint_auth_method": "none",
                  "skip_consent": true,
                  "skip_logout_consent": true
                }' && echo "" && echo "registered client luminary-app"
        restart: on-failure

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
        restart: unless-stopped

volumes:
    # Kratos (uid 10000) and Hydra (uid 100) run as different users, so one
    # shared volume leaves whichever writes first owning it and the other
    # unable to open its database.
    kratos-sqlite:
    hydra-sqlite:
