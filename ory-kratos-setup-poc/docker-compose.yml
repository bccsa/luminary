version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: kratos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    volumes:
      - kratos-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: kratos-migrate
    depends_on:
      - postgres
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos-config:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes

  kratos:
    image: oryd/kratos:v1.3.1
    container_name: kratos
    restart: unless-stopped
    depends_on:
      - postgres
      - kratos-migrate
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    volumes:
      - ./kratos-config:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

  kratos-selfservice-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    container_name: kratos-selfservice-ui
    restart: unless-stopped
    depends_on:
      - kratos
    environment:
      - PORT=4455
      - KRATOS_PUBLIC_URL=http://kratos:4433/
      - KRATOS_BROWSER_URL=http://127.0.0.1:4433/
      - COOKIE_SECRET=PLEASE-CHANGE-ME-I-AM-INSECURE
      - CSRF_COOKIE_NAME=ory_csrf_ui
      - CSRF_COOKIE_SECRET=PLEASE-CHANGE-ME-I-AM-INSECURE
    ports:
      - "4455:4455"

  hydra-migrate:
    image: oryd/hydra:v2.3.0
    container_name: hydra-migrate
    depends_on:
      - postgres
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/hydra?sslmode=disable
    volumes:
      - ./hydra-config:/etc/config/hydra
    command: migrate -c /etc/config/hydra/hydra.yml sql -e --yes

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: hydra
    restart: unless-stopped
    depends_on:
      - postgres
      - hydra-migrate
    environment:
      - DSN=postgres://kratos:kratos@postgres:5432/hydra?sslmode=disable
    ports:
      - "4444:4444" # public API (token/authorize endpoints)
      - "4445:4445" # admin API (create OAuth2 clients, etc.)
    volumes:
      - ./hydra-config:/etc/config/hydra
    command: serve all -c /etc/config/hydra/hydra.yml

  login-consent:
    image: node:20-alpine
    container_name: login-consent
    restart: unless-stopped
    depends_on:
      - kratos
      - hydra
    environment:
      - HYDRA_ADMIN_URL=http://hydra:4445
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_ADMIN_URL=http://kratos:4434
      - PORT=4456
    volumes:
      - ./login-consent:/app
    working_dir: /app
    command: node server.js

  admin:
    image: node:20-alpine
    container_name: ory-admin
    restart: unless-stopped
    depends_on:
      - kratos
      - hydra
    environment:
      - HYDRA_ADMIN_URL=http://hydra:4445
      - KRATOS_ADMIN_URL=http://kratos:4434
      - PORT=4457
    volumes:
      - ./admin:/app
    working_dir: /app
    command: node server.js

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - hydra
      - login-consent
      - admin
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kratos-postgres-data:
  caddy-data:
  caddy-config:
