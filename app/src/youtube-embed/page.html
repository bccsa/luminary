<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>YouTube</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #ui {
        position: fixed;
        inset: 0;
        z-index: 2;
        color: #fff;
        font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #ui[hidden] { display: none; }
      /* Dark behind the bar and the exit, so they read on a bright picture as on a dark one. */
      #ui .fade {
        position: absolute;
        inset: auto 0 0 0;
        height: 48%;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.55) 55%, transparent);
        pointer-events: none;
      }
      #ui .fade-top {
        position: absolute;
        inset: 0 0 auto 0;
        height: 30%;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent);
        pointer-events: none;
      }
      #ui span { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
      #ui .ctl { transition: opacity 0.25s; }
      #ui.idle .ctl { opacity: 0; pointer-events: none; }
      #ui button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        padding: 0;
        color: #fff;
        background: rgba(24, 24, 27, 0.74);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        cursor: pointer;
        touch-action: manipulation;
      }
      #ui button:active { transform: scale(0.94); }
      #ui svg { fill: currentColor; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); }
      /* The skip glyph is an outline: an arc and an arrowhead, with the seconds filled. */
      #ui svg.skip { fill: none; }
      #ui svg.skip text { fill: currentColor; stroke: none; }
      #exit {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        width: 44px;
        height: 44px;
      }
      /* Upright, the status bar and the notch draw over the top of the frame, whose own safe area reads as
         zero: the app says how big the notch is (`--notch`), and the exit sits just under it, on the line of the
         system's own close and picture-in-picture buttons. On its side there is nothing up there. */
      @media (orientation: portrait) {
        #exit { top: calc(var(--notch, 47px) + 2px); }
      }
      #mid {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 32px;
      }
      #pp { width: 80px; height: 80px; }
      #back, #fwd { width: 56px; height: 56px; }
      #bar {
        position: absolute;
        left: calc(env(safe-area-inset-left, 0px) + 20px);
        right: calc(env(safe-area-inset-right, 0px) + 20px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #bar span { min-width: 3.2em; }
      #bar #rem { text-align: right; }
      #seek {
        flex: 1;
        height: 44px;
        margin: 0;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
        touch-action: none;
      }
      #seek::-webkit-slider-runnable-track {
        height: 5px;
        border-radius: 3px;
        background: linear-gradient(to right, #eab308 var(--p, 0%), rgba(255, 255, 255, 0.45) var(--p, 0%));
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
      }
      #seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        margin-top: -6.5px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      #seek::-moz-range-track {
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
      }
      #seek::-moz-range-progress { height: 5px; border-radius: 3px; background: #eab308; }
      #seek::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      iframe,
      #p {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="p"></div>
    <div id="ui" hidden>
      <div class="fade ctl"></div>
      <div class="fade-top ctl"></div>
      <button id="exit" class="ctl" type="button" aria-label="Exit full screen"></button>
      <div id="mid" class="ctl">
        <button id="back" type="button" aria-label="Skip back 10 seconds"></button>
        <button id="pp" type="button" aria-label="Play"></button>
        <button id="fwd" type="button" aria-label="Skip forward 10 seconds"></button>
      </div>
      <div id="bar" class="ctl">
        <span id="el">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span id="rem">-0:00</span>
      </div>
    </div>
    <!--lmc-script-->
  </body>
</html>
