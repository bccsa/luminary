<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex" />
        <title>YouTube</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            #ui {
                position: fixed;
                inset: 0;
                z-index: 2;
                color: #fff;
                font:
                    500 13px/1 system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                font-variant-numeric: tabular-nums;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
                -webkit-user-select: none;
                /* The media player's own inset from the screen's sides. */
                --edge: clamp(20px, 5%, 64px);
            }
            #ui[hidden] {
                display: none;
            }
            /* Dark behind the bar and the exit, so they read on a bright picture as on a dark one. */
            #ui .fade {
                position: absolute;
                inset: auto 0 0 0;
                height: 48%;
                background: linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.75),
                    rgba(0, 0, 0, 0.4) 55%,
                    transparent
                );
                pointer-events: none;
            }
            #ui .fade-top {
                position: absolute;
                inset: 0 0 auto 0;
                height: 30%;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.2) 50%,
                    transparent
                );
                pointer-events: none;
            }
            #ui span {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            #ui .ctl {
                transition: opacity 0.25s;
            }
            #ui.idle .ctl {
                opacity: 0;
                pointer-events: none;
            }
            #ui button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 0;
                padding: 0;
                color: #fff;
                background: rgba(24, 24, 27, 0.58);
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.18),
                    0 10px 30px rgba(0, 0, 0, 0.4);
                border-radius: 50%;
                cursor: pointer;
                touch-action: manipulation;
            }
            #ui button:active {
                transform: scale(0.94);
            }
            #ui svg {
                fill: currentColor;
                filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
            }
            /* The skip glyph is an outline: an arc and an arrowhead, with the seconds filled. */
            #ui svg.skip {
                fill: none;
            }
            #ui svg.skip text {
                fill: currentColor;
                stroke: none;
            }
            /* A bare icon, as the media player's own exit is; the glyph's padding lines it up with the bar's end. */
            #ui #exit {
                position: absolute;
                top: calc(env(safe-area-inset-top, 0px) + 12px);
                right: calc(max(var(--edge), env(safe-area-inset-right, 0px)) - 8px);
                width: 40px;
                height: 40px;
                background: transparent;
                box-shadow: none;
            }
            @media (hover: hover) {
                #ui #exit:hover {
                    background: rgba(255, 255, 255, 0.16);
                }
            }
            /* Upright, the status bar and the notch draw over the top of the frame, whose own safe area reads as
         zero: the app says how big the notch is (`--notch`), and the exit sits just under it, on the line of the
         system's own close and picture-in-picture buttons. On its side there is nothing up there. */
            @media (orientation: portrait) {
                #exit {
                    top: calc(var(--notch, 47px) + 2px);
                }
            }
            #mid {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                align-items: center;
                gap: 32px;
            }
            #pp {
                width: 80px;
                height: 80px;
            }
            #back,
            #fwd {
                width: 56px;
                height: 56px;
            }
            #bar {
                position: absolute;
                left: max(
                    var(--edge),
                    env(safe-area-inset-left, 0px),
                    env(safe-area-inset-right, 0px)
                );
                right: max(
                    var(--edge),
                    env(safe-area-inset-left, 0px),
                    env(safe-area-inset-right, 0px)
                );
                bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
                display: flex;
                align-items: center;
                gap: 12px;
            }
            #bar span {
                min-width: 3.2em;
                font-size: 13px;
                font-weight: 600;
            }
            #bar #rem {
                text-align: right;
            }
            /* The media player's timeline: thick and round, no thumb (the fill is the playhead), the buffered part lighter. */
            #seek {
                flex: 1;
                height: 30px;
                margin: 0;
                background: transparent;
                -webkit-appearance: none;
                appearance: none;
                touch-action: none;
                --track: 12px;
            }
            #seek.held {
                --track: 16px;
            }
            #seek::-webkit-slider-runnable-track {
                height: var(--track);
                border-radius: 9999px;
                background: linear-gradient(
                    to right,
                    #fff var(--p, 0%),
                    rgba(255, 255, 255, 0.4) var(--p, 0%),
                    rgba(255, 255, 255, 0.4) var(--b, 0%),
                    rgba(255, 255, 255, 0.26) var(--b, 0%)
                );
                transition: height 0.15s ease;
            }
            #seek::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 1px;
                height: var(--track);
                opacity: 0;
            }
            #seek::-moz-range-track {
                height: var(--track);
                border-radius: 9999px;
                background: linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.4) var(--b, 0%),
                    rgba(255, 255, 255, 0.26) var(--b, 0%)
                );
            }
            #seek::-moz-range-progress {
                height: var(--track);
                border-radius: 9999px;
                background: #fff;
            }
            #seek::-moz-range-thumb {
                width: 1px;
                height: var(--track);
                border: 0;
                opacity: 0;
            }
            iframe,
            #p {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>
    <body>
        <div id="p"></div>
        <div id="ui" hidden>
            <div class="fade ctl"></div>
            <div class="fade-top ctl"></div>
            <button id="exit" class="ctl" type="button" aria-label="Exit full screen"></button>
            <div id="mid" class="ctl">
                <button id="back" type="button" aria-label="Skip back 10 seconds"></button>
                <button id="pp" type="button" aria-label="Play"></button>
                <button id="fwd" type="button" aria-label="Skip forward 10 seconds"></button>
            </div>
            <div id="bar" class="ctl">
                <span id="el">0:00</span>
                <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
                <span id="rem">-0:00</span>
            </div>
        </div>
        <!--lmc-script-->
    </body>
</html>
