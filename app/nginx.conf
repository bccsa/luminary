server {
    listen       80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # This endpoint is polled by the in-app update banner, so it must stay fresh: the
    # browser must always revalidate (private/no-cache, TTL 0), while a CDN in front of
    # this origin may cache it briefly (public, TTL 60s) to absorb polling load without
    # meaningfully delaying update detection. If you put a CDN in front of this origin,
    # confirm it honours s-maxage as configured here — some CDNs need an explicit
    # rewrite/cache rule instead to get the same small TTL.
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, s-maxage=60";
    }

    # Cache images for 1 year
    location ~* \.(webp|jpe?g|png)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache JS & CSS for 30 days 
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Enable gzip compression (set via docker environment variable)
    __GZIP_DIRECTIVE__

    gzip_types
        text/plain
        text/css
        text/html
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_static on;
}
