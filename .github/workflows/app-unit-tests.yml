name: Run App Unit & Lint Tests
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/app-unit-tests.yml
  workflow_call:

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The encoder's player packages are consumed from media-convert/, which is
          # a submodule rather than a published package. The submodule repository is
          # public, so the built-in token suffices; no extra credential is needed.
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: app/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Build the encoder's player libraries
        # The submodule's packages ship only dist/, which is gitignored — a fresh
        # checkout has sources and no entry points, and Vite fails with "Failed to
        # resolve entry for package". ci:libs installs the five library workspaces
        # without electron; build:libs builds them. Same as both Dockerfiles.
        run: npm run ci:libs; npm run build:libs;
        working-directory: media-convert

      - name: Build shared dependencies
        run: npm ci; npm run build;
        working-directory: shared

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run Unit Tests
        run: npm run test:unit
        working-directory: app

      - name: Run Lint Tests
        run: npm run lint
        working-directory: app

      - name: Run Type Check
        run: npm run type-check
        working-directory: app
