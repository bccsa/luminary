name: "Build & Deploy App to staging"
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/app-deploy-staging.yml
      - shared/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  test-app:
    uses: ./.github/workflows/app-unit-tests.yml

  test-shared:
    uses: ./.github/workflows/shared-unit-tests.yml

  deploy:
    needs: [test-app, test-shared]
    runs-on: [self-hosted, ac]
    environment: app-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The encoder's player packages are consumed from media-convert/, which is
          # a submodule rather than a published package.
          #
          # `luminary-media-convert` is private, and a workflow's GITHUB_TOKEN is
          # scoped to this repository alone — a private sibling answers "Repository
          # not found", so the clone fails before any step runs. The token below is
          # a credential with read access to that repo.
          #
          # It falls back to the built-in token because `actions/checkout` rejects an
          # empty `token:` outright — "Input required and not supplied" — which would
          # break this repository's own checkout while the secret is unset, rather
          # than leaving only the submodule to fail. With the fallback an unset secret
          # degrades to exactly the previous behaviour. If the encoder repository is
          # ever made public, the whole line can go and `submodules: true` suffices.
          submodules: true
          token: ${{ secrets.MEDIA_CONVERT_TOKEN || github.token }}

      - name: Create .env file
        run: |
          touch .env
          echo VITE_APP_NAME="${{ vars.VITE_APP_NAME }}" >> .env
          echo VITE_API_URL="${{ vars.VITE_API_URL }}" >> .env
          echo VITE_PRIVACY_POLICY_ID=="${{ vars.VITE_PRIVACY_POLICY_ID }}" >> .env
          echo VITE_ANALYTICS_HOST="${{ secrets.VITE_ANALYTICS_HOST }}" >> .env
          echo VITE_ANALYTICS_SITEID="${{ secrets.VITE_ANALYTICS_SITEID }}" >> .env
          echo VITE_ALLOWED_MATOMO_SERVERS="${{ vars.VITE_ALLOWED_MATOMO_SERVERS }}" >> .env
          echo VITE_CLIENT_IMAGES_URL="${{ vars.VITE_CLIENT_IMAGES_URL }}" >> .env
          echo VITE_LOGO="${{ vars.VITE_LOGO }}" >> .env
          echo VITE_LOGO_DARK="${{ vars.VITE_LOGO_DARK }}" >> .env
          echo VITE_LOGO_SMALL="${{ vars.VITE_LOGO_SMALL }}" >> .env
          echo VITE_LOGO_SMALL_DARK="${{ vars.VITE_LOGO_SMALL_DARK }}" >> .env
          echo VITE_LOGO_FAVICON=${{vars.VITE_LOGO_FAVICON}} >> .env
          echo VITE_CLIENT_CMS_URL="${{ vars.VITE_CLIENT_CMS_URL }}" >> .env
        working-directory: app

      - name: Build Docker container
        run: docker build -f ./app/Dockerfile . -t ${{ vars.DOCKER_IMAGE }}
        working-directory: ./

      - name: Stop and remove old Docker container
        run: docker stop ${{ vars.DOCKER_CONTAINER }} || true && docker rm ${{ vars.DOCKER_CONTAINER }} || true

      - name: Run Docker container
        run: >
          docker run -d -p "${{ vars.DOCKER_PORT }}":80
          --restart unless-stopped
          --name=${{ vars.DOCKER_CONTAINER }}
          ${{ vars.DOCKER_IMAGE }}
