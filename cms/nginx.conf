server {
    listen       80;

    # nginx does not inherit server-level add_header into a location that sets its own
    # (every location here sets Cache-Control), so the security headers repeat per location.
    # Only host-independent CSP directives live here; script/img/connect allowlists need each deployment's hosts.

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # This endpoint is polled by the in-app update banner, so it must stay fresh: the
    # browser must always revalidate (private/no-cache, TTL 0), while a CDN in front of
    # this origin may cache it briefly (public, TTL 60s) to absorb polling load without
    # meaningfully delaying update detection. If you put a CDN in front of this origin,
    # confirm it honours s-maxage as configured here — some CDNs need an explicit
    # rewrite/cache rule instead to get the same small TTL.
    location = /version.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, s-maxage=60";
    }

    # Enable gzip compression (set via docker environment variable)
    __GZIP_DIRECTIVE__ 

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml

    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_static on;
}
