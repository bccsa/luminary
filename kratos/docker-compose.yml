# Local Kratos for the guest-auth PoC. Nothing here is deployed.
#   docker compose -f kratos/docker-compose.yml up -d
# Kratos public API :4433 (reached through the app's /.ory proxy), admin :4434,
# Mailpit UI http://localhost:8025 — that is where the one-time codes arrive.
services:
    kratos-migrate:
        image: oryd/kratos:v1.3.1
        volumes:
            - kratos-sqlite:/var/lib/sqlite
            - ./config:/etc/config/kratos
        command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
        restart: on-failure

    kratos:
        image: oryd/kratos:v1.3.1
        depends_on:
            kratos-migrate:
                condition: service_completed_successfully
        ports:
            - "4433:4433"
            - "4434:4434"
        volumes:
            - kratos-sqlite:/var/lib/sqlite
            - ./config:/etc/config/kratos
        command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
        restart: unless-stopped

volumes:
    kratos-sqlite:
